services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: casa
      POSTGRES_PASSWORD: casa
      POSTGRES_DB: casa
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U casa -d casa']
      interval: 5s
      timeout: 3s
      retries: 10

  db-test:
    image: postgres:17
    environment:
      POSTGRES_USER: casa
      POSTGRES_PASSWORD: casa
      POSTGRES_DB: casa_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U casa -d casa_test']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
