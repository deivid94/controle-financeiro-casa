name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: casa
          POSTGRES_PASSWORD: casa
          POSTGRES_DB: casa_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U casa -d casa_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # versão vem do packageManager do package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build antes de typecheck/test: os apps importam o dist de @casa/shared
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migrações primeiro, com a URL direta (sem pooler). prisma.config.ts lê DATABASE_URL.
      - name: Migrar banco (Neon)
        run: pnpm --filter @casa/api exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
      # Build remoto na Vercel (Root Directory configurado em cada projeto)
      - name: Deploy da API
        run: pnpm dlx vercel@65 deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
      - name: Deploy do web
        run: pnpm dlx vercel@65 deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
